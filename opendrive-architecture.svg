<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="opendrive-architecture-title opendrive-architecture-desc" id="opendrive-architecture-root">
        <title id="opendrive-architecture-title">OpenDrive System Architecture</title>
        <desc id="opendrive-architecture-desc">Architecture diagram of OpenDrive showing client requests streaming directly through Express to an aggregated Google Drive cluster with zero disk caching, coordinated by MySQL.</desc>

        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #opendrive-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #opendrive-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #opendrive-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #opendrive-architecture-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="opendrive-architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="opendrive-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="opendrive-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="opendrive-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#opendrive-architecture-dots)" opacity="0.55"/>

        <!-- Zone: Client Tier -->
        <rect x="36" y="60" width="168" height="340" rx="8"
              fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="76" y="64" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="120" y="73" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CLIENT TIER</text>

        <!-- Zone: Backend Gateway -->
        <rect x="236" y="60" width="396" height="340" rx="8"
              fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="336" y="64" width="196" height="12" rx="2" fill="#f5f5f5"/>
        <text x="434" y="73" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">OPENDRIVE GATEWAY · PORT 4000</text>

        <!-- Zone: Storage & Cloud -->
        <rect x="664" y="60" width="300" height="340" rx="8"
              fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <rect x="734" y="64" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="814" y="73" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">STORAGE &amp; GOOGLE CLOUD</text>

        <!-- Connectors (drawn before nodes) -->
        <!-- 1. Client to Stream Router (Accent upload flow) -->
        <path d="M 192,204 H 222 Q 230,204 230,196 V 140 Q 230,132 238,132 H 260"
              fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#opendrive-architecture-arrow-accent)"/>

        <!-- 2. Client to Account Manager (REST API calls) -->
        <path d="M 192,236 H 222 Q 230,236 230,244 V 284 Q 230,292 238,292 H 260"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#opendrive-architecture-arrow-link)"/>

        <!-- 3. Stream Router to Google Drive Cluster (Direct in-memory pipe) -->
        <line x1="420" y1="132" x2="688" y2="132" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#opendrive-architecture-arrow-accent)"/>

        <!-- 4. Stream Router to Account Manager (Quota check) -->
        <line x1="340" y1="168" x2="340" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#opendrive-architecture-arrow)"/>

        <!-- 5. Account Manager to Google Gateway (Auth token check) -->
        <line x1="420" y1="292" x2="468" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#opendrive-architecture-arrow)"/>

        <!-- 6. Google Gateway to Google Drive Cluster (OAuth refresh) -->
        <path d="M 540,256 V 224 Q 540,216 548,216 H 808 Q 816,216 816,208 V 168"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#opendrive-architecture-arrow-link)"/>

        <!-- 7. Google Gateway to Prisma MySQL (Encrypt / Decrypt vault) -->
        <line x1="612" y1="292" x2="688" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#opendrive-architecture-arrow)"/>

        <!-- 8. Google Drive Cluster to Prisma MySQL (Metadata sync - passive return) -->
        <line x1="744" y1="168" x2="744" y2="256" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#opendrive-architecture-arrow)"/>

        <!-- Connector Labels with protective masks & 6-10px gap -->
        <!-- Label 1: UPLOAD beside vertical segment at x=230 -->
        <rect x="180" y="162" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="202" y="171" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPLOAD</text>

        <!-- Label 2: REST beside vertical segment at x=230 -->
        <rect x="184" y="254" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="204" y="263" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>

        <!-- Label 3: MEMORY PIPE above line at y=132 -->
        <rect x="514" y="112" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="554" y="121" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY PIPE</text>

        <!-- Label 4: ROUTE QUOTA beside line at x=340 -->
        <rect x="256" y="206" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="294" y="215" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE QUOTA</text>

        <!-- Label 5: AUTH above line at y=292 -->
        <rect x="426" y="272" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="444" y="281" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTH</text>

        <!-- Label 6: OAUTH SYNC above horizontal line at y=216 -->
        <rect x="638" y="196" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="678" y="205" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OAUTH SYNC</text>

        <!-- Label 7: ENCRYPT above line at y=292 -->
        <rect x="626" y="272" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="650" y="281" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENCRYPT</text>

        <!-- Label 8: SYNC META beside line at x=744 -->
        <rect x="676" y="206" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="215" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC META</text>

        <!-- Node 1: Web Client (Dashboard) -->
        <rect x="48" y="184" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="184" width="144" height="72" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="56" y="192" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="70" y="201" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
        <text x="120" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web Dashboard</text>
        <text x="120" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React 19 · Vite (:5173)</text>

        <!-- Node 2: Stream Router (Focal 1 - Coral) -->
        <rect x="260" y="96" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="96" width="160" height="72" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="268" y="104" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="284" y="113" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="412" y="158" fill="#eb6c36" fill-opacity="0.12" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
        <text x="340" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stream Router</text>
        <text x="340" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Busboy · Zero-Disk RAM</text>

        <!-- Node 3: Account Manager -->
        <rect x="260" y="256" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="256" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="268" y="264" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="284" y="273" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="412" y="318" fill="#2d3142" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
        <text x="340" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Account Manager</text>
        <text x="340" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JWT · Quota Router</text>

        <!-- Node 4: Google Gateway (OAuth & Crypto) -->
        <rect x="468" y="256" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="468" y="256" width="144" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="476" y="264" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="494" y="273" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OAUTH</text>
        <text x="540" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Google Gateway</text>
        <text x="540" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AES-256 Token Vault</text>

        <!-- Node 5: Prisma MySQL Store -->
        <rect x="688" y="256" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="256" width="160" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="696" y="264" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="712" y="273" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="768" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prisma MySQL</text>
        <text x="768" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Users · Keys · Shares (:3306)</text>

        <!-- Node 6: Google Drive Cluster (Focal 2 - Cloud) -->
        <rect x="688" y="96" width="256" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="96" width="256" height="72" rx="6" fill="#eb6c36" fill-opacity="0.06" stroke="#eb6c36" stroke-width="1"/>
        <rect x="696" y="104" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="712" y="113" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
        <text x="936" y="158" fill="#eb6c36" fill-opacity="0.09" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">UNLIMITED</text>
        <text x="816" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Google Drive Cluster</text>
        <text x="816" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Multi-Account Pool · 'OpenDrive' Dir</text>

        <!-- Legend strip -->
        <line x1="40" y1="440" x2="960" y2="440" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="472" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / Stream Core</text>

        <rect x="180" y="472" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Internal Gateway</text>

        <rect x="300" y="472" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="320" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Storage / Vault</text>

        <rect x="416" y="472" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <text x="436" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Client / SPA</text>

        <line x1="524" y1="478" x2="552" y2="478" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#opendrive-architecture-arrow-accent)"/>
        <text x="560" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Direct Memory Pipe</text>

        <line x1="680" y1="478" x2="708" y2="478" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#opendrive-architecture-arrow-link)"/>
        <text x="716" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / OAuth Call</text>

        <line x1="832" y1="478" x2="860" y2="478" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#opendrive-architecture-arrow)"/>
        <text x="868" y="480" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Metadata Sync</text>
      </svg>
